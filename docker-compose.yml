services:
  postgres:
    image: postgres:17-alpine
    container_name: northlink_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-northlink}
      POSTGRES_USER: ${DB_USERNAME:-northlink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/01-create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-northlink} -d ${DB_DATABASE:-northlink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: northlink_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: northlink_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_VITE_DEV_SERVER: "false"
      TRUSTED_PROXIES: "172.16.0.0/12"
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      ASSET_URL: ${ASSET_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: northlink_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app
    profiles:
      - tunnel

volumes:
  postgres_data:
  redis_data:
  vendor_data:
