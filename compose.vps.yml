services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${NORTHLINK_ENV_FILE:-.env.vps}
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - northlink_lact_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      internal:
        aliases:
          - northlink-lact-postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - northlink_lact_test_redis:/data
    networks:
      internal:
        aliases:
          - northlink-lact-redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    env_file: ${NORTHLINK_ENV_FILE:-.env.vps}
    environment:
      APP_ROLE: worker
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - northlink_lact_storage:/var/www/html/storage/app
    networks:
      - internal

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    env_file: ${NORTHLINK_ENV_FILE:-.env.vps}
    environment:
      APP_ROLE: scheduler
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - northlink_lact_storage:/var/www/html/storage/app
    networks:
      - internal

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ${NORTHLINK_ENV_FILE:-.env.vps}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - northlink_lact_backups:/backups
    command: >-
      sh -c 'while true; do
      pg_dump --format=custom --file=/backups/northlink-$$(date +%Y%m%d-%H%M%S).dump;
      find /backups -type f -name "*.dump" -mtime +14 -delete;
      sleep 86400;
      done'
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile.vps
    restart: unless-stopped
    env_file: ${NORTHLINK_ENV_FILE:-.env.vps}
    environment:
      APP_ROLE: web
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - northlink_lact_storage:/var/www/html/storage/app
    networks:
      - internal
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.northlink-lact-test-gzip.compress=true
      - traefik.http.middlewares.northlink-lact-test-https.redirectscheme.scheme=https
      - traefik.http.routers.northlink-lact-test-http.entrypoints=http
      - traefik.http.routers.northlink-lact-test-http.rule=Host(`lact.northlinkni.com`)
      - traefik.http.routers.northlink-lact-test-http.middlewares=northlink-lact-test-https
      - traefik.http.routers.northlink-lact-test-http.service=northlink-lact-test
      - traefik.http.routers.northlink-lact-test.entrypoints=https
      - traefik.http.routers.northlink-lact-test.rule=Host(`lact.northlinkni.com`)
      - traefik.http.routers.northlink-lact-test.middlewares=northlink-lact-test-gzip
      - traefik.http.routers.northlink-lact-test.tls=true
      - traefik.http.routers.northlink-lact-test.tls.certresolver=letsencrypt
      - traefik.http.routers.northlink-lact-test.service=northlink-lact-test
      - traefik.http.services.northlink-lact-test.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  northlink_lact_test_postgres:
  northlink_lact_test_redis:
  northlink_lact_backups:
  northlink_lact_storage:

networks:
  internal:
  coolify:
    external: true
