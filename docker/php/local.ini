; El límite por defecto de la imagen php:8.4-fpm es 128M. Ese techo se
; alcanza generando una planilla con miles de colaboradores (cada línea de
; planilla se mantiene en memoria mientras dura la transacción), causando un
; error fatal de PHP en vez de completar la operación. 512M da margen amplio
; incluso para volúmenes grandes, con un costo de memoria trivial para un
; servidor moderno.
memory_limit = 512M
